reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.4"
