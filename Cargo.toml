[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Open Arcanum Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/openarcanum/openarcanum"
homepage = "https://openarcanum.dev"
rust-version = "1.78"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Schema & Validation
schemars = { version = "0.8", features = ["chrono", "uuid1", "url"] }
validator = { version = "0.18", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Web framework (Axum ecosystem)
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "fs"] }
hyper = { version = "1.3", features = ["full"] }

# OpenAPI documentation
utoipa = { version = "4.2", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }

# CLI
clap = { version = "4.5", features = ["derive", "env", "cargo"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }

# Internal crates (path dependencies)
oa-core = { path = "crates/oa-core" }
oa-rules = { path = "crates/oa-rules" }
oa-sdk = { path = "crates/oa-sdk" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
